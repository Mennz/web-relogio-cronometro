<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relogio e Cronometro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Relogio e Cronometro</h1>

  <section class="cartao" id="secao-relogio">
    <h2>Relogio</h2>
    <p class="hora" id="hora-atual">--:--:--</p>
  </section>

  <section class="cartao" id="secao-cronometro">
    <h2>Cronometro</h2>
    <p class="hora" id="tempo-cronometro">00:00</p>
    <div class="botoes">
      <button id="btn-iniciar">Iniciar</button>
      <button id="btn-pausar">Pausar</button>
      <button id="btn-zerar">Zerar</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
